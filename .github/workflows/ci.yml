name: Market Ledger CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: node --check public_build/dist/app.js
      - run: node --check public_build/dist/data.js
      - run: node --check public_build/dist/i18n.js
      - run: test -s public_build/styles.css
